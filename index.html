<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Brainrot Garden</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu"><div class="box">
  <h1>🥚 Brainrot Garden</h1>
  <button onclick="createRoom()">Criar sala</button>
  <div class="join"><input id="code" maxlength="6" inputmode="numeric" placeholder="Código (6 números)"><button onclick="joinRoom($('code').value.trim())">Entrar</button></div>
  <button onclick="findRooms()">Procurar salas</button>
  <div id="rooms"></div>
  <button onclick="solo()">Jogar a solo</button>
  <p id="mstat"></p>
</div></div>
<div id="hud"><span id="money"></span><span id="weather"></span><span id="gate"></span><span id="reb"></span></div>
<div id="main">
  <div id="stage">
    <canvas id="c" width="900" height="600"></canvas>
    <div id="toasts"></div>
    <div id="joy"><div id="knob"></div></div>
  </div>
  <aside id="side">
    <section><h3>🛒 Loja de Equipamentos</h3><div id="shop"></div></section>
    <section><h3>🎒 Mochila (clica para plantar)</h3><div id="inv"></div></section>
    <section><h3>🔄 Rebirth</h3><button id="rbtn" onclick="rebirth()"></button></section>
  </aside>
</div>
<div id="acts">
  <button onclick="buy()">Comprar (B)</button>
  <button onclick="steal()">Roubar (E)</button>
  <button onclick="plantInv(0)">Plantar (F)</button>
  <button onclick="water()">Regar (R)</button>
  <button onclick="sellPlant()">Vender planta (V)</button>
  <button onclick="lockGate()">Portão (G)</button>
</div>
<p id="help">WASD ou setas para mover. Fica perto da esteira vermelha e compra (B) ou rouba (E). Vende com o 💲 da mochila ou com V perto de uma planta. Planta (F) na tua quinta e rega (R). Equipamentos: teclas 1 a 5.</p>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="database.js"></script>
<script src="network.js"></script>
<script src="entities.js"></script>
<script src="engine.js"></script>
<script src="main.js"></script>
</body>
</html>
